name: Daily Book Stats Scraper

on:
  schedule:
    # Springer updates their metrics database daily between 08:30 and 09:00 UTC (09:30-10:00 CET).
    # Scraping at 10:15 UTC (11:15 CET) guarantees Springer's daily batch update has fully completed.
    # A second fallback at 13:15 UTC ensures coverage even if GitHub queues the morning run.
    - cron: '15 10 * * *'   # 11:15 CET / 12:15 CEST (Primary run after Springer's daily update)
    - cron: '15 13 * * *'   # 14:15 CET / 15:15 CEST (Fallback run)
  workflow_dispatch: # Allows manual trigger from GitHub UI / API

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Book Scraper
        run: python book_scraper.py

      - name: Commit and push updated stats
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add book_stats.csv book_stats.xlsx
          # Only commit if changes were detected
          if ! git diff --staged --quiet; then
            git commit -m "Update access statistics: $(date +'%Y-%m-%d')"
            git push
          else
            echo "No changes in metrics today."
          fi
