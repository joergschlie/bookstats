name: Daily Book Stats Scraper

on:
  schedule:
    # Multiple cron slots during the morning (UTC).
    # GitHub's scheduler is best-effort and can silently drop single cron runs.
    # Having multiple schedule checkpoints ensures at least one triggers daily.
    # Since our script safely updates today's row, multiple runs per day are idempotent.
    - cron: '25 4 * * *'   # 05:25 CET / 06:25 CEST
    - cron: '25 6 * * *'   # 07:25 CET / 08:25 CEST
    - cron: '25 8 * * *'   # 09:25 CET / 10:25 CEST
  workflow_dispatch: # Allows manual trigger from GitHub UI / API

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Book Scraper
        run: python book_scraper.py

      - name: Commit and push updated stats
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add book_stats.csv book_stats.xlsx
          # Only commit if changes were detected
          if ! git diff --staged --quiet; then
            git commit -m "Update access statistics: $(date +'%Y-%m-%d')"
            git push
          else
            echo "No changes in metrics today."
          fi
