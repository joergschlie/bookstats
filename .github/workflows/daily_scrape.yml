name: Daily Book Stats Scraper

on:
  schedule:
    # Nighttime execution window between 02:00 and 06:00 CET (01:00 - 05:00 UTC).
    # Why nighttime works best:
    # 1. Springer's daily rolling batch updates from the previous day have 100% completed and settled.
    # 2. GitHub Actions runner congestion is much lower at night (UTC 01:00-05:00) than during peak daytime.
    # 3. 3 staggered checkpoints ensure that if GitHub delays one slot, the next catches it before morning.
    - cron: '20 1 * * *'   # 02:20 CET / 03:20 CEST (Primary night run)
    - cron: '20 3 * * *'   # 04:20 CET / 05:20 CEST (Fallback 1)
    - cron: '20 4 * * *'   # 05:20 CET / 06:20 CEST (Fallback 2)
  workflow_dispatch: # Allows manual trigger from GitHub UI / API

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Book Scraper
        run: python book_scraper.py

      - name: Commit and push updated stats
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add book_stats.csv book_stats.xlsx
          # Only commit if changes were detected
          if ! git diff --staged --quiet; then
            git commit -m "Update access statistics: $(date +'%Y-%m-%d')"
            git push
          else
            echo "No changes in metrics today."
          fi
